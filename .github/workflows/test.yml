name: tests

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt in to Node 24 for JS actions before GitHub flips the default on
# 2026-06-02 and removes Node 20 on 2026-09-16. Without this, CI starts
# failing in 4 days. Verified via the deprecation notice in run logs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Complexity audit
        run: |
          # v1.2.0 ceilings: max_lines=510, max_cc=55 (v1.3.2 bumped from 50
          # to absorb the more accurate CC formula introduced in #21 —
          # Match/match_case/IfExp/AsyncFor/AsyncWith now count), max_nesting=7.
          # These grandfather current code; new violations are blocked.
          # v1.2.1 tightens toward the target (100/15/4) after the Phase refactor.
          python scripts/complexity_audit.py --max-lines 510 --max-cc 55 --max-nesting 7

      - name: Test
        run: pytest -q --tb=short

  build-wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Verify assets in wheel
        run: |
          python - <<'PY'
          # v1.3.2 #22: previously checked `_assets/skills/` as a substring,
          # which passed as long as ANY single skill file was in the wheel —
          # silently allowing a packaging regression that drops a named skill
          # (e.g. one of the v1.3.0 four) to ship. Now each named asset has
          # its own explicit path check.
          import zipfile, os, sys
          wheel = [f for f in os.listdir('dist') if f.endswith('.whl')][0]
          with zipfile.ZipFile(f'dist/{wheel}') as z:
              names = z.namelist()
          required = [
              '_assets/templates/workflow.json',
              # All shipped skills, pinned by SKILL.md path
              '_assets/skills/ultrathink-gap-analysis/SKILL.md',
              '_assets/skills/post-impl-review/SKILL.md',
              '_assets/skills/production-readiness-review/SKILL.md',
              '_assets/skills/spec-quality-check/SKILL.md',
              '_assets/skills/code-quality-loop/SKILL.md',
              '_assets/skills/cost-investigator/SKILL.md',
              '_assets/skills/convergence-coach/SKILL.md',
              # All shipped slash commands
              '_assets/commands/ultrathink.md',
              '_assets/commands/sw-status.md',
              '_assets/commands/sw-dry-run.md',
              '_assets/commands/sw-curate.md',
              '_assets/commands/sw-soak-summary.md',
              # Stop hook
              'hooks/convergence_gate.py',
          ]
          missing = [r for r in required if not any(r in n for n in names)]
          if missing:
              print(f'MISSING from wheel: {missing}'); sys.exit(1)
          print(f'All {len(required)} required assets present in wheel.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
