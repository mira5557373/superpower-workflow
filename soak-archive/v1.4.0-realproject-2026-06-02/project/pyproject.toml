[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shrt"
version = "0.1.0"
description = "Minimal URL shortener with atomic storage"
authors = [{name = "shrt team"}]
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

[project.scripts]
shrt = "shrt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shrt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
